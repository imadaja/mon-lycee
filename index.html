<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lycée Digital Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🏫 Lycée Digital Pro</h1>
    <nav>
        <button onclick="showPage('accueil')">Accueil</button>
        <button onclick="showPage('eleves')">Élèves</button>
        <button onclick="showPage('profs')">Professeurs</button>
        <button onclick="showPage('notes')">Notes</button>
    </nav>
</header>

<!-- ACCUEIL -->
<section id="accueil" class="page active">
    <h2>Bienvenue 👋</h2>
    <p>Système de gestion du lycée moderne</p>
</section>

<!-- ÉLÈVES -->
<section id="eleves" class="page">
    <h2>👨‍🎓 Élèves</h2>
    <input id="nomEleve" placeholder="Nom de l'élève">
    <button onclick="ajouterEleve()">Ajouter</button>
    <ul id="listeEleves"></ul>
</section>

<!-- PROFESSEURS -->
<section id="profs" class="page">
    <h2>👨‍🏫 Professeurs</h2>
    <input id="nomProf" placeholder="Nom du professeur">
    <button onclick="ajouterProf()">Ajouter</button>
    <ul id="listeProfs"></ul>
</section>

<!-- NOTES -->
<section id="notes" class="page">
    <h2>📊 Notes</h2>
    <input id="eleveNote" placeholder="Nom élève">
    <input id="note" type="number" placeholder="Note /20">
    <button onclick="ajouterNote()">Ajouter note</button>
    <ul id="listeNotes"></ul>
</section>

<script src="app.js"></script>
</body>
</html>
